<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Sentinel Pro v5.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="light-theme">

<nav class="navbar">
    <div class="nav-container">
        <div class="brand-area">
            <div class="brand">TIM 3 MAGANG <span>PROJECT</span></div>
            <div class="live-clock" id="live-clock">00:00:00</div>
        </div>
        
        <div class="nav-menu">
            <button onclick="switchTab('realtime')" id="btn-tab-realtime" class="tab-btn active">DASHBOARD</button>
            <button onclick="switchTab('logs')" id="btn-tab-logs" class="tab-btn">LAPORAN 30 HARI</button>
        </div>

        <div class="nav-actions">
            <button onclick="openModal()" class="btn-cool btn-geo">📍 LOKASI</button>
            <button id="toggle-chart" class="btn-cool btn-stats">📊 GRAFIK</button>
            <div class="theme-wrapper">
                <input type="checkbox" id="theme-checkbox" class="theme-input">
                <label for="theme-checkbox" class="theme-label">
                    <div class="theme-ball">
                        <span class="sun-icon">☀️</span>
                        <span class="moon-icon">🌙</span>
                    </div>
                </label>
            </div>
        </div>
    </div>
</nav>

<div id="modal-loc" class="modal-overlay hidden">
    <div class="modal-box card">
        <div class="modal-header">
            <h3>📍 LOKASI ALAT</h3>
            <button onclick="closeModal()" class="btn-close">×</button>
        </div>
        <div class="modal-body">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3950.5511306352934!2d112.52248797485!3d-7.706270792311107!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e7879e8c5e2bb01%3A0x9a75813094c1a0f3!2sTikungan%20Gajah%20Mungkur!5e0!3m2!1sid!2sid!4v1708495000000!5m2!1sid!2sid" width="100%" height="300" style="border:0; border-radius:15px;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<main class="master-container">
    <section class="main-view" id="slide-wrapper">
        
        <div id="view-realtime" class="pane active">
            <div class="status-hero card">
                <div class="hero-overlay"></div>
                <div class="hero-content">
                    <div class="live-pulse"><span class="pulse"></span> LIVE MONITORING</div>
                    <h1 id="main-status-text">CONNECTING...</h1>
                    <p>Sistem Deteksi Tikungan Gajah Mungkur</p>
                </div>
            </div>

            <div class="sensor-grid">
                <div class="card s-box">
                    <small>SUHU UDARA</small>
                    <h2 id="val-temp">--°C</h2>
                    <div class="p-bar"><div id="bar-temp"></div></div>
                </div>
                <div class="card s-box">
                    <small>KELEMBABAN</small>
                    <h2 id="val-hum">--%</h2>
                    <div class="p-bar"><div id="bar-hum"></div></div>
                </div>
                <div class="card s-box">
                    <small>STATUS JALAN</small>
                    <h2 id="val-rain">--</h2>
                    <p id="rain-desc" style="font-size: 0.8rem; margin-top: 5px; font-weight: bold;">STABLE</p>
                </div>
            </div>
        </div>

        <div id="view-logs" class="pane">
            <div class="log-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2>RINGKASAN 30 HARI TERAKHIR</h2>
                <button onclick="exportData()" class="btn-cool btn-export">📥 DOWNLOAD CSV</button>
            </div>
            <div class="calendar-wrapper card">
                <div class="calendar-days-header">
                    <div>MIN</div><div>SEN</div><div>SEL</div><div>RAB</div><div>KAM</div><div>JUM</div><div>SAB</div>
                </div>
                <div class="calendar-grid" id="cal-container"></div>
            </div>
        </div>

    </section>

    <aside id="panel-charts" class="charts-aside hidden">
        <div class="chart-card card">
            <h3>📈 TREN SUHU</h3>
            <canvas id="tempChart"></canvas>
        </div>
        <div class="chart-card card">
            <h3>💧 TREN KELEMBABAN</h3>
            <canvas id="humChart"></canvas>
        </div>
        <div class="chart-card card">
            <h3>🌧️ DATA HUJAN (BINER)</h3>
            <canvas id="rainChart"></canvas>
        </div>
    </aside>
</main>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="script.js"></script>
</body>
</html>
