[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- DAFTAR LIBRARY DEPENDENCIES ---
lib_deps =
    # Library untuk Firebase (Mobizt)
    mobizt/Firebase ESP32 Client @ ^4.4.14
    
    # Library untuk Sensor DHT
    adafruit/DHT sensor library @ ^1.4.6
    
    # Dependency wajib untuk DHT
    adafruit/Adafruit Unified Sensor @ ^1.1.14